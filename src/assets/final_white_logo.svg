<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="117.10 77.13 557.42 282.12" width="100%" height="100%">
  <style>
    .anim-element {
      fill: #ffffff;
      stroke: #ffffff;
      stroke-width: 1px;
      stroke-dasharray: 1800;
      stroke-dashoffset: 1800;
      will-change: stroke-dashoffset, fill-opacity, transform;
      animation: completeSequence 7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    /* Staggered Delay for Progressive Write-In Sequence */
    /* Icon Parts */
    .icon-1 { animation-delay: 0.00s; }
    .icon-2 { animation-delay: 0.12s; }
    .icon-3 { animation-delay: 0.24s; }

    /* Wordmark Letters: M - Y - T - H - I - U - M */
    .txt-m1 { animation-delay: 0.38s; }
    .txt-y  { animation-delay: 0.48s; }
    .txt-t  { animation-delay: 0.58s; }
    .txt-h  { animation-delay: 0.68s; }
    .txt-i  { animation-delay: 0.78s; }
    .txt-u  { animation-delay: 0.88s; }
    .txt-m2 { animation-delay: 0.98s; }

    /* Master Timeline Animation Loop (7.0 Seconds Total) */
    @keyframes completeSequence {
      /* STEP 1: Stroke Write-In Draw (0% to 18%) */
      0% {
        stroke-dashoffset: 1800;
        fill-opacity: 0;
        transform: translateY(0px);
      }
      18% {
        stroke-dashoffset: 0;
        fill-opacity: 0;
        transform: translateY(0px);
      }
      /* Solid Fill Reveal (18% to 24%) */
      24% {
        stroke-dashoffset: 0;
        fill-opacity: 1;
        transform: translateY(0px);
      }

      /* STEP 2: Upward Wave Ripple (28% to 58%) */
      28% {
        transform: translateY(0px);
      }
      43% {
        transform: translateY(-16px);
      }
      58% {
        transform: translateY(0px);
      }

      /* STEP 3: Extended Static Hold (~2.5s Pause) */
      58%, 93% {
        stroke-dashoffset: 0;
        fill-opacity: 1;
        transform: translateY(0px);
      }

      /* STEP 4: Instant Reset to Re-trigger Loop */
      100% {
        stroke-dashoffset: 1800;
        fill-opacity: 0;
        transform: translateY(0px);
      }
    }
  </style>

