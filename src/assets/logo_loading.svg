<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 50 605 100" width="100%" height="100%">
  <style>
    .letter {
      fill: none;
      stroke: #000000;
      stroke-width: 14px;
      stroke-dasharray: 400;
      stroke-linecap: round;
      stroke-linejoin: round;
      will-change: stroke-dashoffset;
      /* Smooth 2.5s infinite loop without static pauses */
      animation: continuousDraw 2.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    /* Staggered Delay for Flowing Wave Effect */
    .l-1 { animation-delay: 0.00s; }
    .l-2 { animation-delay: 0.12s; }
    .l-3 { animation-delay: 0.24s; }
    .l-4 { animation-delay: 0.36s; }
    .l-5 { animation-delay: 0.48s; }
    .l-6 { animation-delay: 0.60s; }
    .l-7 { animation-delay: 0.72s; }

    /* Continuous Infinite Cycle Keyframe */
    @keyframes continuousDraw {
      0% {
        stroke-dashoffset: 400;
      }
      50% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: -400;
      }
    }
  </style>

  <g>
    <!-- M -->
    <path class="letter l-1" d="M 50 140 V 60 L 85 115 L 120 60 V 140" />
    <!-- Y -->
    <path class="letter l-2" d="M 155 60 L 185 102 V 140 M 215 60 L 185 102" />
    <!-- T -->
    <path class="letter l-3" d="M 240 60 H 310 M 275 60 V 140" />
    <!-- H -->
    <path class="letter l-4" d="M 335 60 V 140 M 335 100 H 395 M 395 60 V 140" />
    <!-- I -->
    <path class="letter l-5" d="M 435 60 V 140" />
    <!-- U -->
    <path class="letter l-6" d="M 475 60 V 115 C 475 135, 525 135, 525 115 V 60" />
    <!-- M -->
    <path class="letter l-7" d="M 565 140 V 60 L 600 115 L 635 60 V 140" />
  </g>
</svg>
